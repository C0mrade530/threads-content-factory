[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-content-factory"
version = "0.1.0"
description = "Threads контент завод — интервью, адаптация примеров и управляемый из чата автопостинг"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "tzdata>=2024.1"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
threads-factory = "threads_factory.cli:main"

[tool.setuptools.packages.find]
include = ["threads_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
